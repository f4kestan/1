<!DOCTYPE html>

<head>

<title>看 · fakestan.qd.je</title>
<style>
:root {
  --bg:#0f1115; --card:#171a21; --text:#e6e8ec; --muted:#8a8f98;
  --accent:#4f8cff; --border:#2a2f3a;
}
body.light {
  --bg:#f4f6fb; --card:#ffffff; --text:#1a1d24; --muted:#6b7280;
  --accent:#2f6fed; --border:#e5e8ef;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { min-height:100vh; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  transition:background .4s,color .4s; display:flex; align-items:center; justify-content:center; padding:24px; }
.wrap { max-width:520px; width:100%; text-align:center; }
header { margin-bottom:24px; }
h1 { font-size:26px; font-weight:700; }
h1 .dot { color:var(--accent); }
.back { color:var(--accent); text-decoration:none; font-size:14px; }
.back:hover { text-decoration:underline; }
.card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:40px 24px; transition:background .4s,border .4s; }
.emoji { font-size:56px; margin-bottom:16px; }
.msg { color:var(--muted); font-size:15px; line-height:1.7; }
.footer { text-align:center; color:var(--muted); font-size:12px; margin-top:30px; opacity:.7; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>看<span class="dot">。</span>影视观看</h1>
