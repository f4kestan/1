<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>fakestan.qd.je — 建设中</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #171a21;
      --text: #e6e8ec;
      --muted: #8a8f98;
      --accent: #4f8cff;
      --border: #2a2f3a;
    }
    body.light {
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #1a1d24;
      --muted: #6b7280;
      --accent: #2f6fed;
      --border: #e5e8ef;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      padding: 24px;
      transition: background 0.5s ease, color 0.5s ease;
    }
    .card {
      text-align: center;
      max-width: 560px;
      width: 100%;
    }
    .badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 999px;
      background: var(--card);
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.5px;
      border: 1px solid var(--border);
      margin-bottom: 28px;
      transition: background 0.5s ease, border 0.5s ease;
    }
    h1 {
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
      line-height: 1.3;
    }
    h1 .dot { color: var(--accent); }
    .domain {
      font-size: 18px;
      color: var(--accent);
      margin-bottom: 20px;
      font-weight: 500;
    }
    p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
      margin-bottom: 28px;
    }

    /* ===== 时钟 ===== */
    .clock {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px 20px;
      margin-bottom: 20px;
      transition: background 0.5s ease, border 0.5s ease;
    }
    .clock .time {
      font-size: 42px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 1px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .clock .date { font-size: 16px; color: var(--accent); margin-top: 14px; font-weight: 500; }
    .clock .lunar { font-size: 14px; color: var(--muted); margin-top: 10px; line-height: 1.6; }

    /* ===== 天气 ===== */
    .weather {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
      text-align: left;
      transition: background 0.5s ease, border 0.5s ease;
    }
    .weather .w-title { font-size: 13px; color: var(--muted); letter-spacing: 0.5px; margin-bottom: 16px; }
    .weather .w-now {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
    }
    .weather .w-icon { flex: 0 0 auto; }
    .weather .w-icon svg { display: block; }
    .weather .w-temp { font-size: 40px; font-weight: 700; color: var(--text); line-height: 1; }
    .weather .w-desc {
      margin-left: auto;
      text-align: right;
      font-size: 14px;
      color: var(--muted);
      line-height: 1.7;
    }
    .weather .w-desc b { color: var(--text); font-weight: 500; }

    .weather .w-meta {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }
    .weather .w-meta .meta-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--bg);
      font-size: 13px;
      color: var(--muted);
    }
    .weather .w-meta .meta-item svg { flex: 0 0 auto; }
    .weather .w-meta .meta-item b { color: var(--text); font-weight: 500; margin-left: auto; }

    .weather .w-moon {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border-radius: 10px;
      background: var(--bg);
      margin-bottom: 18px;
    }
    .weather .w-moon svg { flex: 0 0 auto; }
    .weather .w-moon .moon-info { font-size: 13px; color: var(--muted); line-height: 1.6; }
    .weather .w-moon .moon-info b { color: var(--text); font-weight: 500; }

    .weather .w-forecast {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 6px;
      -webkit-overflow-scrolling: touch;
    }
    .weather .w-forecast::-webkit-scrollbar { height: 4px; }
    .weather .w-forecast::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .weather .w-day {
      flex: 0 0 auto;
      min-width: 60px;
      text-align: center;
      padding: 10px 6px;
      border-radius: 10px;
      background: var(--bg);
    }
    .weather .w-day .wd-date { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .weather .w-day .wd-icon { margin-bottom: 6px; }
    .weather .w-day .wd-icon svg { display: block; margin: 0 auto; }
    .weather .w-day .wd-high { font-size: 13px; color: var(--text); font-weight: 500; }
    .weather .w-day .wd-low { font-size: 12px; color: var(--muted); }

    /* ===== 联系按钮 ===== */
    .contact-btn {
      display: inline-block;
      padding: 12px 28px;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
      margin-bottom: 24px;
      transition: transform 0.15s ease, background 0.15s ease;
      cursor: pointer;
    }
    .contact-btn:hover { background: #3d7ae6; transform: translateY(-2px); }

    .progress {
      width: 100%;
      height: 10px;
      border-radius: 5px;
      background: var(--card);
      overflow: hidden;
      margin-bottom: 8px;
      border: 1px solid var(--border);
    }
    .progress .bar {
      display: block;
      height: 100%;
      width: 1%;
      background: linear-gradient(90deg, var(--accent), #7bb0ff);
      border-radius: 5px;
      position: relative;
      overflow: hidden;
    }
    /* 光带内部流动的亮光 */
    .progress .bar::after {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.85), transparent);
      animation: flow 1.4s linear infinite;
    }
    @keyframes flow {
      0%   { left: -100%; }
      100% { left: 100%; }
    }
    .progress-label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 20px;
      font-variant-numeric: tabular-nums;
    }
    .footer { font-size: 12px; color: var(--muted); letter-spacing: 0.3px; opacity: 0.7; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">COMING SOON</div>
    <h1>大师的网站正在建设中</h1>
    <div class="domain">fakestan.qd.je</div>
    <p>网站内容正在准备中，预计很快与大家见面。<br />有任何事欢迎通过下方邮箱联系我。</p>

    <!-- 时钟 -->
    <div class="clock">
      <div class="time" id="clockTime">00:00:00</div>
      <div class="date" id="clockDate">----年--月--日 星期-</div>
      <div class="lunar" id="clockLunar">农历加载中…</div>
    </div>

    <!-- 天气 -->
    <div class="weather">
      <div class="w-title">四平市铁东区 · 天气</div>
      <div class="w-now">
        <span class="w-icon" id="wIcon"></span>
        <span class="w-temp" id="wTemp">--°</span>
        <span class="w-desc" id="wDesc">加载中…</span>
      </div>
      <div class="w-meta" id="wMeta"></div>
      <div class="w-moon" id="wMoon"></div>
      <div class="w-forecast" id="wForecast"></div>
    </div>

    <a class="contact-btn" href="mailto:3157536021@qq.com">联系我</a>

    <div class="progress"><span class="bar"></span></div>
    <div class="progress-label">当前进度 1%</div>
    <div class="footer">fakestan.qd.je · 敬请期待</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.6.12/lunar.js"></script>
  <script>
    // ===== 北京时间 + 农历 =====
    const weekMap = ['日', '一', '二', '三', '四', '五', '六'];
    function pad(n) { return n < 10 ? '0' + n : '' + n; }

    function tick() {
      const parts = new Intl.DateTimeFormat('zh-CN', {
        timeZone: 'Asia/Shanghai',
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', second: '2-digit',
        hour12: false, weekday: 'short'
      }).formatToParts(new Date());

      const get = (type) => parts.find(p => p.type === type)?.value ?? '';
      const y = get('year'), mo = get('month'), d = get('day');
      const h = get('hour'), mi = get('minute'), s = get('second');
      const weekdayRaw = get('weekday');
      const weekIdx = weekdayRaw ? weekMap.findIndex(w => weekdayRaw.includes(w)) : 0;
      const weekName = weekIdx >= 0 ? weekMap[weekIdx] : '';
      const hour = (parseInt(h, 10) % 24);

      document.getElementById('clockTime').textContent = pad(hour) + ':' + mi + ':' + s;
      document.getElementById('clockDate').textContent = y + '年' + mo + '月' + d + '日 星期' + weekName;

      try {
        if (typeof Lunar !== 'undefined' && Lunar.fromDate) {
          const lunar = Lunar.fromDate(new Date());
          const lunarText = '农历 ' + lunar.getYearInGanZhi() + '年（' + lunar.getYearShengXiao() + '）'
            + lunar.getMonthInChinese() + '月' + lunar.getDayInChinese()
            + (lunar.getJieQi() ? ' · ' + lunar.getJieQi() : '');
          document.getElementById('clockLunar').textContent = lunarText;
        }
      } catch (e) {}
    }
    tick();
    setInterval(tick, 1000);

    // ===== SVG 天气图标 =====
    function svgWeather(code, size) {
      const s = size || 40;
      const cloud = `<path d="M20 48 a10 10 0 0 1 0-20 a12 12 0 0 1 23-3 a9 9 0 0 1 1 23 z" fill="#9aa4b2"/>`;
      const cloudDark = `<path d="M20 48 a10 10 0 0 1 0-20 a12 12 0 0 1 23-3 a9 9 0 0 1 1 23 z" fill="#6b7280"/>`;
      const sun = `<circle cx="32" cy="32" r="14" fill="#f5b301"/><g stroke="#f5b301" stroke-width="3" stroke-linecap="round"><line x1="32" y1="6" x2="32" y2="14"/><line x1="32" y1="50" x2="32" y2="58"/><line x1="6" y1="32" x2="14" y2="32"/><line x1="50" y1="32" x2="58" y2="32"/><line x1="13.6" y1="13.6" x2="19.3" y2="19.3"/><line x1="44.7" y1="44.7" x2="50.4" y2="50.4"/><line x1="13.6" y1="50.4" x2="19.3" y2="44.7"/><line x1="44.7" y1="19.3" x2="50.4" y2="13.6"/></g>`;
      const sunCloud = `<circle cx="24" cy="24" r="12" fill="#f5b301"/><path d="M20 48 a10 10 0 0 1 0-20 a12 12 0 0 1 23-3 a9 9 0 0 1 1 23 z" fill="#9aa4b2"/>`;
      const rain = (n) => {
        let lines = '';
        const xs = [24, 30, 36, 27, 33];
        for (let i = 0; i < n; i++) lines += `<line x1="${xs[i]}" y1="52" x2="${xs[i] - 2}" y2="58" stroke="#4f8cff" stroke-width="3" stroke-linecap="round"/>`;
        return cloud + '<g>' + lines + '</g>';
      };
      const snow = (n) => {
        let dots = '';
        const xs = [25, 32, 39, 28, 35];
        for (let i = 0; i < n; i++) dots += `<circle cx="${xs[i]}" cy="54" r="2.5" fill="#c8d0dc"/>`;
        return cloud + '<g>' + dots + '</g>';
      };
      const thunder = `<path d="M32 14 l-6 12 h12 z" fill="#f5b301"/><path d="M20 48 a10 10 0 0 1 0-20 a12 12 0 0 1 23-3 a9 9 0 0 1 1 23 z" fill="#6b7280"/>`;

      const map = {
        0: sun,
        1: sunCloud,
        2: cloud,
        3: cloudDark,
        45: `<g stroke="#9aa4b2" stroke-width="4" stroke-linecap="round"><line x1="20" y1="40" x2="44" y2="40"/><line x1="18" y1="48" x2="46" y2="48"/></g>`,
        48: `<g stroke="#9aa4b2" stroke-width="4" stroke-linecap="round"><line x1="20" y1="40" x2="44" y2="40"/><line x1="18" y1="48" x2="46" y2="48"/></g>`,
        51: rain(3), 53: rain(3), 55: rain(3),
        61: rain(3), 63: rain(3), 65: rain(4), 66: rain(3), 67: rain(3),
        71: snow(3), 73: snow(3), 75: snow(4), 77: snow(2),
        80: rain(2), 81: rain(3), 82: rain(4),
        85: snow(2), 86: snow(3),
        95: thunder, 96: thunder, 99: thunder
      };
      const inner = map[code] || cloud;
      return `<svg width="${s}" height="${s}" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
    }

    const weatherText = {
      0: '晴', 1: '晴间多云', 2: '多云', 3: '阴',
      45: '雾', 48: '雾凇',
      51: '小毛毛雨', 53: '毛毛雨', 55: '大毛毛雨',
      61: '小雨', 63: '中雨', 65: '大雨', 66: '冻雨', 67: '冻雨',
      71: '小雪', 73: '中雪', 75: '大雪', 77: '雪粒',
      80: '阵雨', 81: '阵雨', 82: '强阵雨',
      85: '阵雪', 86: '强阵雪',
      95: '雷阵雨', 96: '雷阵雨伴冰雹', 99: '强雷阵雨伴冰雹'
    };

    // ===== 月相 =====
    function svgMoon(phase, size) {
      const s = size || 44;
      const r = 16, cx = 22, cy = 22;
      const illum = Math.abs(phase - 0.5) * 2;
      let shadow;
      if (phase < 0.5) {
        const off = r * (1 - illum);
        shadow = `<circle cx="${cx + off}" cy="${cy}" r="${r}" fill="#6b7280"/>`;
      } else {
        const off = r * (1 - illum);
        shadow = `<circle cx="${cx - off}" cy="${cy}" r="${r}" fill="#6b7280"/>`;
      }
      return `<svg width="${s}" height="${s}" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="${cx}" cy="${cy}" r="${r}" fill="#e8edf5"/>${shadow}</svg>`;
    }

    function moonName(phase) {
      if (phase < 0.03 || phase > 0.97) return '新月';
      if (phase < 0.22) return '娥眉月';
      if (phase < 0.28) return '上弦月';
      if (phase < 0.47) return '盈凸月';
      if (phase < 0.53) return '满月';
      if (phase < 0.72) return '亏凸月';
      if (phase < 0.78) return '下弦月';
      return '残月';
    }

    function windDir(deg) {
      const dirs = ['北', '东北', '东', '东南', '南', '西南', '西', '西北'];
      return dirs[Math.round(deg / 45) % 8] + '风';
    }

    function metaIcon(inner) {
      return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
    }

    let sunriseToday = null, sunsetToday = null;

    // 带超时的 fetch，避免请求永久 pending 导致一直"加载中"
    async function fetchWithTimeout(url, ms) {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), ms);
      try {
        return await fetch(url, { signal: ctrl.signal });
      } finally {
        clearTimeout(t);
      }
    }

    async function loadWeather() {
      const url = 'https://api.open-meteo.com/v1/forecast'
        + '?latitude=43.16&longitude=124.35'
        + '&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m,relative_humidity_2m,precipitation'
        + '&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,moonrise,moonset,moon_phase'
        + '&timezone=Asia%2FShanghai&forecast_days=16';

      // 自动重试：最多 3 次，间隔递增（1s / 2s / 4s）
      let data = null;
      for (let attempt = 1; attempt <= 3; attempt++) {
        try {
          const res = await fetchWithTimeout(url, 10000);
          if (!res.ok) throw new Error('HTTP ' + res.status);
          data = await res.json();
          break;
        } catch (e) {
          if (attempt < 3) {
            await new Promise(r => setTimeout(r, 1000 * Math.pow(2, attempt - 1)));
          }
        }
      }

      if (!data) {
        renderWeatherError();
        return;
      }

      try {

        const code = data.current.weather_code;
        const desc = weatherText[code] || '未知';
        const temp = Math.round(data.current.temperature_2m);

        document.getElementById('wIcon').innerHTML = svgWeather(code, 52);
        document.getElementById('wTemp').textContent = temp + '°C';
        document.getElementById('wDesc').innerHTML =
          '<b>' + desc + '</b><br>体感 ' + Math.round(data.current.apparent_temperature) + '°C';

        const humidity = data.current.relative_humidity_2m;
        const wind = Math.round(data.current.wind_speed_10m);
        const winddir = windDir(data.current.wind_direction_10m);
        const precip = data.current.precipitation;

        const metaHTML =
          '<div class="meta-item">' + metaIcon('<path d="M3 10 a7 7 0 0 1 14-2 5 5 0 0 1 0 10 H3 z"/>') + '湿度<b>' + humidity + '%</b></div>'
          + '<div class="meta-item">' + metaIcon('<path d="M3 8 h11 a4 4 0 1 0-4-4"/><path d="M3 16 h16 a3 3 0 1 1-3 3"/>') + '风力<b>' + wind + ' km/h ' + winddir + '</b></div>'
          + '<div class="meta-item">' + metaIcon('<path d="M3 12 h16 a4 4 0 0 1-4 4 h-8"/>') + '降水<b>' + precip + ' mm</b></div>'
          + '<div class="meta-item">' + metaIcon('<circle cx="12" cy="12" r="9"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/>') + '日出/日落<b id="wSun">--</b></div>';
        document.getElementById('wMeta').innerHTML = metaHTML;

        const phase = data.daily.moon_phase[0];
        document.getElementById('wMoon').innerHTML =
          svgMoon(phase, 44)
          + '<div class="moon-info"><b>' + moonName(phase) + '</b><br>月出 ' + (data.daily.moonrise[0] || '--').slice(11, 16)
          + ' · 月落 ' + (data.daily.moonset[0] || '--').slice(11, 16) + '</div>';

        sunriseToday = data.daily.sunrise[0];
        sunsetToday = data.daily.sunset[0];
        document.getElementById('wSun').textContent =
          sunriseToday.slice(11, 16) + ' / ' + sunsetToday.slice(11, 16);

        const times = data.daily.time;
        const codes = data.daily.weather_code;
        const highs = data.daily.temperature_2m_max;
        const lows = data.daily.temperature_2m_min;
        let html = '';
        for (let i = 0; i < times.length; i++) {
          const d = new Date(times[i] + 'T00:00:00');
          const label = (d.getMonth() + 1) + '/' + d.getDate();
          html += '<div class="w-day">'
            + '<div class="wd-date">' + label + '</div>'
            + '<div class="wd-icon">' + svgWeather(codes[i], 26) + '</div>'
            + '<div class="wd-high">' + Math.round(highs[i]) + '°</div>'
            + '<div class="wd-low">' + Math.round(lows[i]) + '°</div>'
            + '</div>';
        }
        document.getElementById('wForecast').innerHTML = html;

        applyTheme();
      } catch (e) {
        renderWeatherError();
      }
    }

    // 加载失败时的兜底显示 + 点击重试
    function renderWeatherError() {
      const desc = document.getElementById('wDesc');
      desc.innerHTML = '<b>天气加载失败</b><br><span class="retry">点击重试</span>';
      desc.style.cursor = 'pointer';
      desc.onclick = () => {
        desc.innerHTML = '<b>重新加载中…</b>';
        desc.style.cursor = 'default';
        loadWeather();
      };
    }

    // ===== 根据日出日落切换深浅主题 =====
    function applyTheme() {
      if (!sunriseToday || !sunsetToday) return;
      const bj = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Shanghai' }));
      const nowMin = bj.getHours() * 60 + bj.getMinutes();
      const sr = parseInt(sunriseToday.slice(11, 13)) * 60 + parseInt(sunriseToday.slice(14, 16));
      const ss = parseInt(sunsetToday.slice(11, 13)) * 60 + parseInt(sunsetToday.slice(14, 16));
      const isDay = nowMin >= sr && nowMin < ss;
      document.body.classList.toggle('light', isDay);
    }

    loadWeather();
    setInterval(applyTheme, 60000);
  </script>
</body>
</html>
