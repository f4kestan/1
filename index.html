<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>fakestan.qd.je — 建设中</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #171a21;
      --text: #e6e8ec;
      --muted: #8a8f98;
      --accent: #4f8cff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      padding: 24px;
    }
    .card {
      text-align: center;
      max-width: 560px;
      width: 100%;
    }
    .badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 999px;
      background: var(--card);
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.5px;
      border: 1px solid #2a2f3a;
      margin-bottom: 28px;
    }
    h1 {
      font-size: 44px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
    }
    h1 .dot {
      color: var(--accent);
    }
    .domain {
      font-size: 18px;
      color: var(--accent);
      margin-bottom: 20px;
      font-weight: 500;
    }
    p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
      margin-bottom: 32px;
    }
    .progress {
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: var(--card);
      overflow: hidden;
      margin-bottom: 20px;
    }
    .progress::after {
      content: "";
      display: block;
      width: 30%;
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      animation: slide 2s ease-in-out infinite;
    }
    @keyframes slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(400%); }
    }
    .footer {
      font-size: 12px;
      color: #4a4f58;
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">COMING SOON</div>
    <h1>建设中<span class="dot">。</span></h1>
    <div class="domain">fakestan.qd.je</div>
    <p>这个域名已经注册好了，网站内容正在准备中。<br />请稍后再来。</p>
    <div class="progress"></div>
    <div class="footer">fakestan.qd.je · 敬请期待</div>
  </div>
</body>
</html>
