<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>阅读 · fakestan.qd.je</title>
<style>
:root {
  --bg:#0f1115; --card:#171a21; --text:#e6e8ec; --muted:#8a8f98;
  --accent:#4f8cff; --border:#2a2f3a;
}
body.light {
  --bg:#f4f6fb; --card:#ffffff; --text:#1a1d24; --muted:#6b7280;
  --accent:#2f6fed; --border:#e5e8ef;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { min-height:100vh; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",serif;
  transition:background .4s,color .4s; }
.wrap { max-width:760px; margin:0 auto; padding:30px 20px 60px; }
.topbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
.back { color:var(--accent); text-decoration:none; font-size:14px; }
.back:hover { text-decoration:underline; }
h1 { font-size:24px; font-weight:700; margin-bottom:6px; line-height:1.4; }
.meta { color:var(--muted); font-size:13px; margin-bottom:20px; }
.content { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:28px 26px;
  font-size:16px; line-height:1.9; white-space:pre-wrap; word-break:break-word;
  transition:background .4s,border .4s; }
.loading { color:var(--muted); text-align:center; padding:40px; }
.footer { text-align:center; color:var(--muted); font-size:12px; margin-top:24px; opacity:.7; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="学习.html">← 返回目录</a>
    <span id="pageInfo" style="color:var(--muted);font-size:13px"></span>
  </div>
  <h1 id="docTitle">加载中…</h1>
  <div class="meta" id="docMeta"></div>
  <div class="content" id="docContent"><div class="loading">正在加载文档…</div></div>
  <div class="footer">fakestan.qd.je · 学习分区</div>
</div>

<script>
const params = new URLSearchParams(location.search);
const id = params.get('id');

fetch('reader_index.json').then(r => r.json()).then(index => {
  const doc = index[id];
  if (!doc) {
    document.getElementById('docContent').textContent = '文档不存在';
    document.getElementById('docTitle').textContent = '未找到';
    return;
  }
  document.getElementById('docTitle').textContent = doc.title;
  document.getElementById('docMeta').textContent = doc.cat + ' / ' + doc.sub + ' · ' + doc.pages + ' 页';
  // 加载对应 txt
  return fetch('text/' + doc.file).then(r => r.text()).then(text => {
    document.getElementById('docContent').textContent = text;
    document.getElementById('pageInfo').textContent = '共 ' + (text.length / 1000).toFixed(0) + ' 千字';
  });
}).catch(e => {
  document.getElementById('docContent').innerHTML = '<div class="loading">加载失败：' + e.message + '</div>';
});
</script>
</body>
</html>
